<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReSector</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f7fb; --fg: #162033; --muted: #667085; --accent: #315b9a; --accent-2: #6e95d6;
    --line: #d7deea; --card: #ffffff; --danger: #bd4b4b; --glow: 49 91 154; --wash: .09;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1624; --fg: #e8edf6; --muted: #9aa8ba; --accent: #6e95d6; --accent-2: #8aace7;
      --line: #2b3a51; --card: #151f30; --danger: #e08383; --glow: 110 149 214; --wash: .16;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 60% 50% at 50% 38%, rgb(var(--glow) / var(--wash)), transparent 70%),
      var(--bg);
    color: var(--fg);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center;
  }
  /* faint dot grid */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgb(var(--glow) / .22) 1px, transparent 1px);
    background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(ellipse 55% 55% at 50% 45%, #000 20%, transparent 75%);
            mask-image: radial-gradient(ellipse 55% 55% at 50% 45%, #000 20%, transparent 75%);
    opacity: .55;
  }
  main { position: relative; text-align: center; width: min(26rem, 88vw); animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .mark { position: relative; width: 132px; height: 132px; margin: 0 auto 1.6rem; display: grid; place-items: center; }
  .mark img { width: 92px; height: 92px; object-fit: contain; position: relative; z-index: 1; animation: breathe 3.2s ease-in-out infinite; }
  .ring, .ring::after {
    position: absolute; inset: 0; border-radius: 50%;
  }
  .ring {
    border: 2px solid transparent;
    border-top-color: var(--accent); border-right-color: rgb(var(--glow) / .35);
    animation: spin 1.6s linear infinite;
  }
  .ring::after { content: ""; inset: 10px; border: 1px solid rgb(var(--glow) / .22); }
  .halo { position: absolute; inset: -22px; border-radius: 50%; background: radial-gradient(closest-side, rgb(var(--glow) / .22), transparent); animation: pulse 3.2s ease-in-out infinite; }
  h1 { margin: 0; font-size: 1.85rem; font-weight: 650; letter-spacing: .01em; }
  .tag { margin: .35rem 0 0; color: var(--muted); font-size: .95rem; }
  .bar { position: relative; height: 4px; margin: 2rem auto 0; width: 62%; border-radius: 4px; background: rgb(var(--glow) / .16); overflow: hidden; }
  .bar::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 42%; border-radius: 4px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
    animation: slide 1.5s ease-in-out infinite;
  }
  #status { margin: 1rem 0 0; min-height: 1.4em; color: var(--muted); font-size: .88rem; transition: opacity .35s; }
  #hint { margin: .35rem 0 0; min-height: 1.2em; color: var(--muted); font-size: .78rem; opacity: 0; transition: opacity .6s; }
  #hint.on { opacity: .8; }
  footer { position: fixed; left: 0; right: 0; bottom: 1.1rem; text-align: center; color: var(--muted); font-size: .74rem; opacity: .75; }

  /* error state */
  #err { display: none; margin-top: 1.6rem; text-align: left; background: var(--card); border: 1px solid rgb(var(--glow) / .25);
         border-left: 3px solid var(--danger); border-radius: 10px; padding: .9rem 1rem; font-size: .84rem; }
  #err p { margin: 0 0 .6rem; }
  #err pre { margin: 0 0 .7rem; white-space: pre-wrap; word-break: break-word; font: .76rem/1.45 ui-monospace, Consolas, monospace; color: var(--muted); max-height: 9rem; overflow: auto; }
  #err button { background: var(--accent); color: var(--bg); border: 0; border-radius: 8px; padding: .45rem .9rem; font-size: .8rem; font-weight: 600; cursor: pointer; }
  body.failed .ring, body.failed .bar, body.failed #status, body.failed #hint { display: none; }
  body.failed .mark img { animation: none; opacity: .9; }
  body.failed #err { display: block; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slide { 0% { left: -45%; } 100% { left: 103%; } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; }
    .bar::before { left: 0; width: 100%; opacity: .5; }
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <span class="halo"></span>
    <span class="ring"></span>
    <picture>
      <source srcset="logo-dark.png" media="(prefers-color-scheme: dark)" />
      <img src="logo-light.png" alt="" />
    </picture>
  </div>
  <h1>ReSector</h1>
  <p class="tag">Your local research workspace</p>
  <div class="bar" role="progressbar" aria-label="Starting ReSector"></div>
  <p id="status" role="status" aria-live="polite">Starting up…</p>
  <p id="hint"></p>

  <div id="err" role="alert">
    <p><strong>ReSector couldn't start.</strong></p>
    <pre id="errText"></pre>
    <button id="copy" type="button">Copy details</button>
  </div>
</main>
<footer>Your papers and keys stay on this computer.</footer>

<script>
  // Friendly, honest-enough stages: they follow elapsed time (the shell only tells us when the app is ready).
  var stages = [
    [0,     "Starting up…"],
    [2500,  "Preparing your workspace…"],
    [7000,  "Loading the search engine…"],
    [14000, "Almost there…"]
  ];
  var status = document.getElementById("status");
  var hint = document.getElementById("hint");
  var t0 = Date.now(), last = 0;
  var timer = setInterval(function () {
    var el = Date.now() - t0, idx = 0;
    for (var i = 0; i < stages.length; i++) if (el >= stages[i][0]) idx = i;
    if (idx !== last) {
      last = idx; status.style.opacity = 0;
      setTimeout(function () { status.textContent = stages[idx][1]; status.style.opacity = 1; }, 220);
    }
    if (el > 20000) { hint.textContent = "The first launch can take a minute. Later ones are quicker."; hint.className = "on"; }
  }, 400);

  // Called by the native shell if the backend fails to start.
  window.showError = function (text) {
    clearInterval(timer);
    document.body.className = "failed";
    document.getElementById("errText").textContent = text;
  };
  document.getElementById("copy").addEventListener("click", function () {
    var t = document.getElementById("errText").textContent;
    var done = function () { document.getElementById("copy").textContent = "Copied"; };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, done); else done();
  });
</script>
</body>
</html>
