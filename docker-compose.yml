# Single-container deployment: PostgreSQL, ChromaDB, Backend, and Frontend
# Usage: docker compose up --build

services:
  resector:
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
    container_name: resector
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - resector_data:/app/data
    environment:
      DATABASE_URL: postgresql://resector:resector@127.0.0.1:5432/resector
      CHROMA_HOST: 127.0.0.1
      CHROMA_PORT: "5000"
      NEXT_PUBLIC_API_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  resector_data:
