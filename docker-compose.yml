version: '3.8'

# Single-container deployment for local development
# Usage: docker-compose up --build

services:
  resector:
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
    container_name: resector-app
    ports:
      - "3000:3000"  # Frontend (primary access point)
      - "8000:8000"  # Backend API (optional, for direct access)
    volumes:
      - resector_data:/app/data              # ChromaDB + uploads + PostgreSQL persistence
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  resector_data:
