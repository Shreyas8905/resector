[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /app/data/postgres
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql_err.log
priority=1
startsecs=3

[program:chromadb]
command=chroma
parameter run,--host,127.0.0.1,--port,5000,--path,/app/data/chroma
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/chromadb.log
stderr_logfile=/var/log/supervisor/chromadb_err.log
priority=10
startsecs=5

[program:backend]
command=uvicorn
parameter backend.main:app,--host,0.0.0.0,--port,8000
directory=/app
environment=DATABASE_URL="postgresql://resector:resector@127.0.0.1:5432/resector",CHROMA_HOST="127.0.0.1",CHROMA_PORT="5000"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend_err.log
priority=20
startsecs=5

[program:frontend]
command=npm
parameter start
directory=/app/frontend
environment=NODE_ENV="production",NEXT_PUBLIC_API_URL="http://localhost:8000"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/frontend.log
stderr_logfile=/var/log/supervisor/frontend_err.log
priority=30
startsecs=5
